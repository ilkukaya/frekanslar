[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Trailing-slash policy: Astro's static output is directory-style
# (/foo/index.html for the /foo/ route -- see `trailingSlash: 'always'`
# in astro.config.mjs), and Netlify's static asset server already
# 301-redirects a bare "/foo" request to "/foo/" by default for exactly
# this output shape, so no custom redirect rule is needed (or safe to
# add -- a naive `/*` -> `/:splat/` rule would loop on paths that
# already end in a slash).

# --- Security headers -------------------------------------------------
# CSP allows exactly the third parties the site can use:
#  - Google AdSense + Funding Choices (consent) and Google Analytics 4 --
#    only loaded when PUBLIC_ADSENSE_CLIENT / PUBLIC_GA4_ID are set;
#  - brand icons from Google's favicon service (img-src https:).
# The "official listen/watch" actions are plain <a target="_blank">
# navigations, never iframes. 'unsafe-inline' stays because Astro inlines
# small per-page scripts/styles and a static site has no per-request nonce.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://*.googlesyndication.com https://www.googletagmanager.com https://*.google.com https://*.doubleclick.net https://*.gstatic.com https://fundingchoicesmessages.google.com https://*.adtrafficquality.google; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://*.googlesyndication.com https://*.doubleclick.net https://*.google.com https://*.adtrafficquality.google; frame-src https://*.doubleclick.net https://*.google.com https://*.googlesyndication.com https://*.adtrafficquality.google; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# --- Caching ------------------------------------------------------------
# Hashed build assets (content-addressed filenames) are immutable --
# cache them for a year. Only a trailing "/prefix/*" splat is used here;
# Netlify's header-matching glob support for a wildcard in the middle of
# a path segment (e.g. "/*.html") isn't reliable, so HTML pages, the
# search index and the sitemaps are deliberately left to Netlify's own
# (already conservative, non-immutable) default caching for anything
# outside of /_astro/*.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og-default.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/search-index.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# Old placeholder-only routes that no longer have content.
[[redirects]]
  from = "/transponder/*"
  to = "/uydu-frekanslari/"
  status = 301
