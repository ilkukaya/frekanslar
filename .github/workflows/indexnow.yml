name: IndexNow

# Tells Bing/Yandex about every URL after content changes. Runs weekly and
# can be started by hand from the Actions tab ("Run workflow").
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run seo:indexnow
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://frekanslar.netlify.app' }}
